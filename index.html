<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil Thalis — Official Website</title>
    <!-- Fontes de Luxo e Minimalistas -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & VARIÁVEIS DO PROMPT --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-black: #050506;
            --purple-deep: #120621;
            --aged-gold: #b89742;
            --aged-silver: #a3a8b3;
            --text-light: #f5f5f7;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            overflow: hidden; /* Mantém o foco cinematográfico sem scroll inicial */
        }

        /* --- FUNDO CINEMATOGRÁFICO & PARTÍCULAS --- */
        .cinematic-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 50% 40%, transparent 20%, var(--bg-black) 85%),
                linear-gradient(to bottom, transparent 50%, var(--bg-black) 100%),
                radial-gradient(circle at 70% 30%, rgba(26, 11, 46, 0.65) 0%, transparent 60%);
            background-size: cover;
            background-position: center;
        }

        /* Placeholder simulando a arte do Lil Thalis em estilo anime de alta costura */
        .anime-hero-silhouette {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background-image: url('https://unsplash.com'); /* Substitua pelo link da sua IA */
            background-size: cover;
            background-position: center 30%;
            opacity: 0.35;
            filter: grayscale(30%) contrast(120%) brightness(60%);
        }

        /* Efeito de Partículas Soft Ambientais (Anime Atmosphere) */
        .particles-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
            background-image: radial-gradient(rgba(184, 151, 66, 0.15) 1px, transparent 0), radial-gradient(rgba(147, 51, 234, 0.2) 2px, transparent 0);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            animation: particleShift 20s linear infinite;
        }

        @keyframes particleShift {
            0% { background-position: 0 0, 25px 25px; opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { background-position: 50px 100px, 75px 125px; opacity: 0.4; }
        }

        /* --- INTERFACE DO SITE (UI) --- */
        .ui-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* Header inspirado no The Weeknd (Ultra Minimalista) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(163, 168, 179, 0.1);
            padding-bottom: 20px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 6px;
            color: var(--text-light);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
        }

        nav a {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--aged-silver);
            text-decoration: none;
            margin-left: 35px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        nav a:hover {
            color: var(--aged-gold);
            text-shadow: 0 0 8px rgba(184, 151, 66, 0.5);
        }

        /* Conteúdo Principal (Centralizado e Emocional) */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: auto;
            margin-bottom: auto;
        }

        .sub-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--aged-gold);
            margin-bottom: 15px;
            font-weight: 400;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 400;
            letter-spacing: 18px;
            line-height: 1.1;
            margin-bottom: 40px;
            background: linear-gradient(180deg, #ffffff 40%, var(--aged-silver) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Botão Premium de Chamada (Call to Action) */
        .cta-button {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--bg-black);
            background-color: var(--aged-gold);
            padding: 16px 45px;
            border: 1px solid var(--aged-gold);
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--aged-gold);
            box-shadow: 0 0 25px rgba(184, 151, 66, 0.4);
            border: 1px solid var(--aged-gold);
        }

        /* Rodapé de Lançamento / Mídias */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(163, 168, 179, 0.1);
            padding-top: 25px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--aged-silver);
        }

        .current-era {
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        /* Detalhe de pulso japonês/sombrio na UI */
        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #9333ea;
            border-radius: 50%;
            box-shadow: 0 0 10px #9333ea;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #b89742; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .social-links a {
            color: var(--aged-silver);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: var(--text-light);
        }

        /* Responsividade Básica para telas menores */
        @media (max-width: 768px) {
            .ui-wrapper { padding: 30px 25px; }
            .main-title { font-size: 2.8rem; letter-spacing: 8px; }
            nav { display: none; } /* Simplificação mobile estilo The Weeknd */
        }
    </style>
</head>
<body>

    <!-- Camadas Visuais de Fundo (Engine Gráfica do Site) -->
    <div class="anime-hero-silhouette"></div>
    <div class="cinematic-background"></div>
    <div class="particles-overlay"></div>

    <!-- Interface do Usuário (Menus e Textos) -->
    <div class="ui-wrapper">
        
        <header>
            <a href="#" class="logo">THALIS</a>
            <nav>
                <a href="#">Música</a>
                <a href="#">Editorial</a>
                <a href="#">Tour</a>
                <a href="#">Loja</a>
            </nav>
        </header>

        <main>
            <h3 class="sub-title">The New Cinematic Era</h3>
            <h1 class="main-title">LIL THALIS</h1>
            <a href="#" class="cta-button">Enter The Void</a>
        </main>

        <footer>
            <div class="current-era">
                <span class="status-dot"></span>
                <span>Álbum em breve / Tokyo Session</span>
            </div>
            <div class="social-links">
                <a href="#">Spotify</a>
                <a href="#">Instagram</a>
                <a href="#">YouTube</a>
            </div>
        </footer>

    </div>

</body>
</html>
